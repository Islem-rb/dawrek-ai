<!doctype html>
<html lang="ar-TN" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e7c6b">
  <title>Dawrek · دورك</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%230e7c6b'/><text x='32' y='44' font-size='34' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>D</text></svg>">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Dawrek">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<main class="app">
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark">د</span><span>Dawrek <small data-i18n="tagline"></small></span></a>
    <div class="top-actions">
      <button class="btn btn-soft text-size" id="big" type="button" aria-pressed="false" data-i18n-title="bigText">Aa</button>
      <div class="lang-switch" id="lang"></div>
    </div>
  </header>

  <!-- 1. Pick a service -->
  <section id="home" class="hidden">
    <div class="hero">
      <div class="clinic-chip hidden" id="clinic"></div>
      <h1 data-i18n="heroTitle"></h1>
      <p data-i18n="heroText"></p>
    </div>
    <div class="emergency" role="note">
      <span aria-hidden="true">🚑</span>
      <div><b data-i18n="emergencyTitle"></b><span data-i18n="emergencyText"></span> <a href="tel:190">190</a></div>
    </div>
    <h2 class="section-title" data-i18n="chooseService"></h2>
    <input class="name-input" id="name" maxlength="40" autocomplete="given-name" data-i18n-placeholder="namePlaceholder">
    <label class="appt-toggle">
      <input type="checkbox" id="appt">
      <span><b data-i18n="haveAppointment"></b><small data-i18n="apptHint"></small></span>
    </label>
    <div class="services" id="services"></div>
  </section>

  <!-- 2. Live ticket -->
  <section id="ticket-view" class="hidden">
    <div class="card ticket" id="ticket-card">
      <div class="ticket-label" data-i18n="yourTicket"></div>
      <div class="ticket-number ticket-no" id="t-number"></div>
      <div class="ticket-service" id="t-service"></div>
      <span class="pill" id="t-status"></span>
      <div class="appt-note hidden" id="t-appt"></div>
      <div class="ticket-sep"></div>

      <div id="t-live">
        <div class="ring-wrap">
          <svg width="168" height="168" viewBox="0 0 168 168" aria-hidden="true">
            <circle class="ring-bg" cx="84" cy="84" r="72" fill="none" stroke-width="14"/>
            <circle class="ring-fg" id="ring" cx="84" cy="84" r="72" fill="none" stroke-width="14" stroke-dasharray="452.4" stroke-dashoffset="452.4"/>
          </svg>
          <div class="ring-center"><b id="t-ahead">0</b><small data-i18n="peopleAhead"></small></div>
        </div>
        <div class="stats-row">
          <div class="stat"><small data-i18n="estWait"></small><b id="t-eta"></b></div>
          <div class="stat"><small data-i18n="nowServing"></small><b class="ticket-no" id="t-serving"></b></div>
        </div>
        <div class="notice notice-amber hidden" id="t-noshow" data-i18n="noShowWarn"></div>
      </div>

      <div id="t-end" class="hidden">
        <p id="t-end-text"></p>
      </div>
    </div>
    <div class="card alerts hidden" id="alerts">
      <span class="alerts-icon" aria-hidden="true">🔔</span>
      <div>
        <b data-i18n="alertsTitle"></b>
        <p id="alerts-text"></p>
        <button class="btn btn-primary" id="alerts-btn" type="button" data-i18n="alertsBtn"></button>
      </div>
    </div>
    <div style="margin-top:14px; display:grid; gap:8px">
      <button class="btn btn-ghost btn-block" id="leave" data-i18n="leaveQueue"></button>
      <button class="btn btn-primary btn-block hidden" id="again" data-i18n="newTicket"></button>
    </div>
  </section>
</main>

<!-- "Your turn" moment -->
<div class="called-overlay hidden" id="called" role="alertdialog" aria-live="assertive">
  <div>
    <h2 data-i18n="statusCalled"></h2>
    <div class="big ticket-no" id="c-number"></div>
    <div class="desk"><span data-i18n="goToDesk"></span> <span id="c-desk"></span></div>
    <button class="btn" id="c-ok" data-i18n="gotIt"></button>
  </div>
</div>

<!-- Assistant -->
<button class="fab" id="open-chat">💬 <span data-i18n="askDawrek"></span></button>
<div class="sheet-backdrop hidden" id="backdrop"></div>
<section class="sheet hidden" id="chat" aria-label="Dawrek assistant">
  <div class="sheet-head">
    <div><b data-i18n="chatTitle"></b><span class="pill" id="ai-pill"></span></div>
    <button class="btn btn-ghost" id="close-chat" aria-label="Close">✕</button>
  </div>
  <div class="messages" id="messages"></div>
  <div class="chips" id="chips"></div>
  <div class="voice-status hidden" id="voice-status" aria-live="polite"></div>
  <form class="composer" id="composer">
    <button class="btn btn-soft mic hidden" type="button" id="mic">🎤</button>
    <input id="msg" autocomplete="off" maxlength="1000" data-i18n-placeholder="chatPlaceholder">
    <button class="btn btn-primary" type="submit" aria-label="Send">➤</button>
  </form>
</section>

<script src="/static/i18n.js"></script>
<script src="/static/patient.js"></script>
</body>
</html>
